version: "1.0"
meta:
    description: Teste de layout com button
    name: test_layout_button

layout:
    id: root
    type: row
    items:
        - id: left
          type: box
          component: menu
          width: 12
        - id: center
          type: box
          component: deploy_button
          width: 25
        - id: right
          type: box
          component: output
          flex: 1

components:
    - id: menu
      type: list
      props:
        items:
            - id: item1
              text: "Item 1"
            - id: item2
              text: "Item 2"
    - id: deploy_button
      type: button
      props:
        text: "DEPLOY"
        style: "primary"
    - id: output
      type: viewport
      props:
        source:
            type: static
            content: "Viewport de teste com button"

events: []
