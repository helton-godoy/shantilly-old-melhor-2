# .pre-commit-config.yaml
# Configuração para o framework pre-commit.
# Executa hooks automatizados antes de cada commit para garantir a qualidade do código.

repos:
  # Repositório com hooks genéricos para a saúde do repositório.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        # Garante que os arquivos de CI e configuração YAML são válidos.
      - id: end-of-file-fixer
        # Garante que os arquivos terminem com uma nova linha.
      - id: trailing-whitespace
        # Remove espaços em branco no final das linhas.

  # Repositório para ferramentas Go.
  - repo: https://github.com/dnephin/pre-commit-go
    rev: v1.0.1
    hooks:
      - id: gofumpt
        # Garante que todo o código Go está formatado corretamente.
        # Ele reescreve os arquivos automaticamente (`-w`).

  # Repositório oficial para o golangci-lint.
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.59.1 # Mesma versão do nosso CI para consistência.
    hooks:
      - id: golangci-lint
        # Executa o linter nos arquivos alterados.
        # É rápido e focado, pegando a maioria dos problemas antes do push.
        args: ["--config=.golangci.yml"]

# NOTA: Os testes (`go test`) não estão incluídos aqui de propósito.
# Hooks de pre-commit devem ser rápidos para não atrapalhar o fluxo do desenvolvedor.
# Os testes completos são executados no script `lint.sh` e, de forma definitiva, no CI.
