name: "Gate E1.6 — Encapsulamento do Legado (FormComponent + internal/tui) — Wave 6"
status: "implemented"
owner: "bmad-qa"
severity: "blocker"

scope:
  - "cmd/shantilly/main.go"
  - "internal/components/form_component.go"
  - "internal/config/**"
  - "internal/tui/**"
  - "internal/runtime/**"
  - "internal/components/**"
  - "docs/architecture/**"

checks:
  - id: "allowed-legacy-entrypoints"
    type: "static_scan"
    description: "Uso de FormConfig/internal/tui permitido apenas nos pontos de entrada/sandbox autorizados."
    allowed_paths:
      - "cmd/shantilly/main.go"                # CLI legado + formCmd
      - "internal/components/form_component.go" # sandbox FormComponent
      - "internal/tui/"
      - "internal/config/"
    patterns_allowed:
      - "internal/tui"
      - "FormConfig"
    patterns_forbidden:
      - "internal/tui"
      - "FormConfig"
    forbidden_outside_allowed_paths: true
    notes:
      - "Qualquer nova referência a internal/tui ou FormConfig fora dos caminhos permitidos é violação crítica."

  - id: "no-legacy-in-runtime-v2"
    type: "static_scan"
    description: "Proibir referências ao legado dentro do runtime declarativo v2.0."
    paths:
      - "internal/runtime/"
      - "internal/components/"
    patterns_forbidden:
      - "internal/tui"
      - "FormConfig"
      - "shantilly form"
    expectations:
      - "Nenhum componente ou engine v2.0 importa ou chama diretamente código legado."
    notes:
      - "Alinha com docs/architecture/components.md (Wave 6) e AGENTS.md."

  - id: "legacy-does-not-bypass-pipeline"
    type: "static_scan"
    description: "Legado não pode chamar ScriptRunner/Modal Stack/EventManager diretamente contornando o pipeline declarativo."
    paths:
      - "internal/tui/"
      - "internal/components/form_component.go"
    patterns_forbidden:
      - "ScriptRunner("
      - "ModalStack"
      - "ShantillyEvent"
      - "EventManager"
    expectations:
      - "Legado permanece encapsulado; integração com o runtime v2.0 ocorre apenas via FormComponent sandbox quando aplicável."

  - id: "no-new-legacy-contracts"
    type: "static_scan"
    description: "Proibir criação de novos contratos YAML ou CLIs baseados em v1.x."
    paths:
      - "cmd/"
      - "docs/"
      - "internal/"
    patterns_forbidden:
      - "shantilly form"
      - "FormConfig" # fora dos caminhos permitidos acima
      - "legacy cli"
    notes:
      - "Reforça contrato único AppConfig; qualquer exceção deve ser marcada explicitamente como legacy e aprovada."

enforcement:
  on_pr:
    - "run: go test ./..."
    - "run: go vet ./..."
    - "run: golangci-lint run ./..."
    - "fail_if_any_forbidden_pattern"
  on_main_branch:
    - "block_release_if_violations"
    - "require_all_gate_checks_green"