name: "Gate E1.5 — Segurança JIT + Anti-Trojan YAML"
status: "implemented"
owner: "bmad-qa"
severity: "blocker"

scope:
  - "AppConfig declarativo v2.0"
  - "docs/architecture/security.md"
  - "internal/runtime/runner/**"
  - "internal/runtime/event/**"
  - "internal/components/**"

checks:
  - id: "deny-by-default-appconfig"
    type: "static_scan"
    description: "AppConfig e modelos relacionados não aceitam chaves desconhecidas silenciosamente (deny-by-default)."
    paths:
      - "internal/"
      - "docs/architecture/security.md"
      - "docs/architecture/data-models.md"
    patterns_required:
      - "deny by default"
    expectations:
      - "Qualquer chave YAML desconhecida resulta em erro de validação explícito."
    notes:
      - "Implementação deve seguir contratos em docs/architecture/security.md e docs/architecture/data-models.md."

  - id: "runaction-securitypolicy-integration"
    type: "static_scan"
    description: "RunAction/ScriptRunner sempre avaliados contra SecurityPolicy/whitelist antes de execuções."
    paths:
      - "internal/runtime/runner/"
    patterns_required:
      - "normalizePolicy"
      - "validateRunAction"
      - "isAllowedScript"
    expectations:
      - "Nenhuma execução de script ocorre sem passar pela política de segurança."
    notes:
      - "Baseado em internal/runtime/runner/runner.go."

  - id: "no-implicit-autorun-yaml"
    type: "static_scan"
    description: "Proibir auto-run implícito de scripts a partir de YAML sem on:/RunAction explícito."
    paths:
      - "internal/"
      - "docs/"
    patterns_forbidden:
      - "autorun"
      - "auto_run"
      - "on_start:"
    notes:
      - "Qualquer semântica de auto-run deve ser rejeitada em revisão/CI."

  - id: "whitelist-runaction-types-and-paths"
    type: "policy_definition"
    description: "Definir whitelist mínima e revisável de tipos/paths permitidos para RunAction."
    allowed_script_types:
      - "shell"
      - "bash"
      - "sh"
    allowed_path_prefixes:
      - "./"
      - "scripts/"
    forbidden_path_patterns:
      - "/etc/"
      - "/var/"
      - "/root/"
      - ".."
    expectations:
      - "SecurityPolicy recusa comandos fora da whitelist de tipos/paths."
    notes:
      - "Mantida alinhada a docs/architecture/security.md (E1.5, Wave 7)."

  - id: "no-silent-non-whitelisted-actions"
    type: "static_scan"
    description: "Nenhuma chave/ação fora da whitelist é aceita silenciosamente."
    paths:
      - "internal/"
    expectations:
      - "Chaves desconhecidas ou ações não-whitelist disparam erro de validação/log explícito e falham o load."

enforcement:
  on_pr:
    - "run: go test ./internal/runtime/runner/... ./internal/runtime/event/... ./internal/components/..."
    - "run: go vet ./..."
    - "run: golangci-lint run ./..."
    - "fail_if_any_forbidden_pattern"
  on_main_branch:
    - "block_release_if_violations"
    - "require_all_gate_checks_green"