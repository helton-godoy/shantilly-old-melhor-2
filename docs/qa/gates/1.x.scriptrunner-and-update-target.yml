name: "Gate E1.4 — ScriptRunner único + 1 processo por update_target (Wave 4)"
status: "implemented"
owner: "bmad-qa"
severity: "blocker"

scope:
  - "internal/runtime/runner/**"
  - "internal/runtime/event/**"
  - "cmd/shantilly/main.go"
  - "docs/architecture/**"
  - "AGENTS.md"

checks:
  - id: "scriptrunner-location-and-usage"
    type: "static_scan"
    description: "ScriptRunner e uso de os/exec só podem existir em internal/runtime/runner/**; chamado via pipeline on:/EventManager."
    paths:
      - "internal/"
    patterns_forbidden:
      - "exec.Command("
      - "exec.Cmd{"
      - ".Start("
      - ".Run("
    exceptions:
      - "internal/runtime/runner/"
    expectations:
      - "Nenhum outro pacote além de internal/runtime/runner usa diretamente os/exec."
    notes:
      - "Alinhado a AGENTS.md e docs/architecture/governance-runtime-tui-v2.0.md#3-wave-4--scriptrunner-e14."

  - id: "no-direct-script-exec-outside-scriptrunner"
    type: "static_scan"
    description: "Nenhuma execução de script fora de ScriptRunner."
    paths:
      - "internal/"
    patterns_forbidden:
      - "sh.Command("
      - "bash -c"
    exceptions:
      - "internal/runtime/runner/"
    expectations:
      - "Qualquer novo runner paralelo ou bypass é bloqueado."

  - id: "one-process-per-update-target"
    type: "test_policy"
    description: "Testes garantem 1 processo por update_target com cancelamento do anterior."
    required_tests:
      - "internal/runtime/runner"
    expectations:
      - "Iniciar novo run para mesmo update_target cancela o anterior com SIGTERM/SIGKILL conforme contrato."
    notes:
      - "Criterios cobertos em internal/runtime/runner/runner_test.go."

  - id: "update-target-wiring"
    type: "test_policy"
    description: "Saída do ScriptRunner é roteada apenas via update_target declarativo."
    required_tests:
      - "internal/runtime/runner"
    expectations:
      - "Eventos/update_target corretos por execução, sem escrita direta em UI fora do contrato."

enforcement:
  on_pr:
    - "run: go test ./internal/runtime/runner/..."
    - "run: go vet ./internal/runtime/runner/..."
    - "run: golangci-lint run ./internal/runtime/runner/..."
    - "fail_if_any_forbidden_pattern"
    - "fail_if_missing_required_tests"
  on_main_branch:
    - "block_release_if_violations"
    - "require_all_gate_checks_green"