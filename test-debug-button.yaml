version: "1.0"
meta:
    description: Debug button isolado
    name: debug_button

layout:
    id: root
    type: row
    items:
        - id: left
          type: box
          component: deploy_button
          width: 20
        - id: right
          type: box
          component: output
          flex: 1

components:
