# .github/workflows/release.yml
# Automatiza a criação de releases no GitHub usando GoReleaser.
# Acionado sempre que uma nova tag no formato 'v*' é enviada.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    name: Run GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          # Busca todo o histórico do Git para que GoReleaser possa gerar o changelog corretamente.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Alinhado com a versão do go.mod para garantir consistência.
          go-version: "1.24.2"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Versão do GoReleaser fixada para um processo de release estável.
          version: v2.0.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
