# .github/workflows/build.yml
# Este workflow garante que o projeto compila, passa em todos os testes (incluindo
# detecção de race conditions) e envia a cobertura de código para análise.
# Ele é projetado para ser robusto e reprodutível.

name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # --- JOB 1: CONSTRUÇÃO E TESTES ---
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Alinhado com a versão do go.mod para garantir consistência.
          go-version: "1.24.2"
          cache: true

      - name: Build
        # CLAREZA: Um passo explícito para compilar o projeto.
        run: go build -v ./...

      - name: Run Tests with Race Detector and Coverage
        # ROBUSTEZ: Comando de teste avançado com detector de race condition.
        run: go test -v -failfast -race -coverpkg=./... -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt

  # --- JOB 2: AUTOMAÇÃO DO DEPENDABOT ---
  # Este job aprova e mescla automaticamente os PRs do Dependabot se o job 'build-and-test' passar.
  dependabot-auto-merge:
    name: Dependabot Auto-Merge
    needs: [build-and-test] # Só executa se os testes e o build passarem.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    # Condição para executar apenas em PRs do Dependabot.
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'}}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and Merge Dependabot PR
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"
