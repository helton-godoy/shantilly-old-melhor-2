# .github/workflows/build.yml
# Otimizado para acionar apenas em alterações de código relevantes, push para main ou manualmente.
name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- JOB 0: FILTRO DE CAMINHOS ---
  # Este job verifica se as alterações no PR são relevantes para o build.
  # Ele fornece um output claro nos logs, explicando por que o build foi pulado.
  path-filter:
    name: Check for relevant file changes
    runs-on: ubuntu-latest
    outputs:
      # Output 'should_run' será 'true' se algum dos caminhos corresponder.
      should_run: ${{ steps.filter.outputs.go_code_changes == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Go code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go_code_changes:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/build.yml'

  # --- JOB 1: CONSTRUÇÃO E TESTES ---
  build-and-test:
    name: Build & Test
    needs: [path-filter]
    # CONDIÇÃO DE EXECUÇÃO:
    # 1. Se o path-filter detectar alterações relevantes em um PR.
    # 2. Sempre em push para a branch 'main' para garantir sua integridade.
    # 3. Sempre em acionamentos manuais (workflow_dispatch).
    if: |
      needs.path-filter.outputs.should_run == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Run Tests with Race Detector and Coverage
        run: go test -v -failfast -race -coverpkg=./... -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Check Coverage Threshold
        run: |
          # Extrai a porcentagem total de coverage do relatório
          COVERAGE=$(go tool cover -func=coverage.txt | tail -1 | awk '{print $3}' | sed 's/%//')
          
          echo "📊 Coverage atual: ${COVERAGE}%"
          
          # Define threshold mínimo (ajustar conforme baseline atual)
          THRESHOLD=65.0
          
          # Compara usando bc para suportar decimais
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ FALHOU: Coverage ${COVERAGE}% está abaixo do threshold ${THRESHOLD}%"
            echo ""
            echo "Por favor, adicione testes para aumentar a cobertura."
            echo "Meta: ≥70% (threshold atual temporário: ${THRESHOLD}%)"
            exit 1
          fi
          
          echo "✅ PASSOU: Coverage ${COVERAGE}% está acima do threshold ${THRESHOLD}%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt
          fail_ci_if_error: true

  # --- JOB 2: AUTOMAÇÃO DO DEPENDABOT ---
  dependabot-auto-merge:
    name: Dependabot Auto-Merge
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    # Condição aprimorada: só executa se o build passar.
    if: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' && needs.build-and-test.result == 'success' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and Merge Dependabot PR
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --squash --auto "$PR_URL"
