name: "Governança Waves 4-7 (Gates 1.x + Go checks)"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-waves4-7:
    name: "Governança Waves 4-7 — Gates 1.x + Go Vet/Lint/Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Test
        run: go test ./...

      - name: Go Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.0
          args: ./...

      - name: Gate 1.x.no-osexit-core — proibido os.Exit fora de cmd/shantilly/main.go
        run: |
          echo "Verificando uso de os.Exit fora de cmd/shantilly/main.go..."
          violations=$(grep -RIn "os.Exit" --exclude-dir=.git --exclude="cmd/shantilly/main.go" || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Encontrado os.Exit fora de cmd/shantilly/main.go:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.legacy-formcomponent-encapsulation — confinamento do legado
        run: |
          echo "Verificando encapsulamento do legado (FormConfig/internal/tui)..."
          # Permitido apenas em internal/components/form_component.go e internal/tui/**
          violations=$(grep -RInE "FormConfig|internal/tui" \
            --exclude-dir=.git \
            --exclude="internal/components/form_component.go" \
            --exclude-dir="internal/tui" || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Uso de FormConfig/internal/tui fora do sandbox permitido:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.scriptrunner-and-update-target — ScriptRunner único
        run: |
          echo "Verificando execução de scripts apenas em internal/runtime/runner/**..."
          violations=$(grep -RInE "exec.Command|os/exec" \
            --exclude-dir=.git \
            --exclude-dir="internal/runtime/runner" || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Execução de scripts encontrada fora de internal/runtime/runner/**:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.layout-manager — sem automação no LayoutManager
        run: |
          echo "Verificando se internal/runtime/layout/** não contém automação proibida..."
          violations=$(grep -RInE "RunAction|run\.script|update_target|FormConfig|internal/tui" internal/runtime/layout || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Padrões proibidos encontrados em internal/runtime/layout/**:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.event-engine - pipeline unico EventManager + on
        run: |
          echo "Checking for absence of suspicious parallel routes in the Event Engine..."
          # Block suspicious direct calls in internal/runtime/event/**
          violations=$(grep -RInE "exec.Command|os/exec|os.Exit" internal/runtime/event || true)
          if [ -n "$violations" ]; then
            echo "FAIL: Disallowed patterns found in internal/runtime/event/**:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.modal-stack — Modal Stack única
        run: |
          echo "Verificando definições de Modal Stack apenas em internal/runtime/modal/**..."
          # Heurística simples para impedir criação paralela óbvia em outros pacotes
          violations=$(grep -RInE "type ModalStack|pushModal|popModal" \
            --exclude-dir=.git \
            --exclude-dir="internal/runtime/modal" || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Indícios de modal stack fora de internal/runtime/modal/**:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.security-jit-anti-trojan — segurança JIT + anti-Trojan YAML
        run: |
          echo "Verificando presença de contratos de segurança JIT / Anti-Trojan (heurística gate)..."
          # Este passo é heurístico: garante que arquivos normativos existem e são versionados.
          required_files=(
            "docs/qa/gates/1.x.security-jit-anti-trojan.yml"
            "docs/architecture/security.md"
          )
          missing=""
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              missing="$missing\n- $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "FALHA: Artefatos normativos esperados não encontrados:$missing"
            exit 1
          fi

      - name: Gate 1.x + Matriz — consistência mínima documental
        run: |
          echo "Verificando existência da matriz QA e gates principais..."
          if [ ! -f "docs/qa/matrix-epic-1-runtime-tui-coverage.md" ]; then
            echo "FALHA: Matriz de QA não encontrada em docs/qa/matrix-epic-1-runtime-tui-coverage.md"
            exit 1
          fi
          for gate in \
            "docs/qa/gates/1.x.layout-manager.yml" \
            "docs/qa/gates/1.x.event-engine.yml" \
            "docs/qa/gates/1.x.scriptrunner-and-update-target.yml" \
            "docs/qa/gates/1.x.modal-stack.yml" \
            "docs/qa/gates/1.x.legacy-formcomponent-encapsulation.yml" \
            "docs/qa/gates/1.x.no-osexit-core.yml" \
            "docs/qa/gates/1.x.security-jit-anti-trojan.yml" \
          ; do
            if [ ! -f "$gate" ]; then
              echo "FALHA: Gate normativo obrigatório ausente: $gate"
              exit 1
            fi
          done
