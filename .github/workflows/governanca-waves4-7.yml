# .github/workflows/governanca-waves4-7.yml
# Otimizado para acionar apenas em alterações de código relevantes, push para main ou manualmente.
# Refatorado em jobs distintos para clareza e manutenibilidade.
name: "Governança Waves 4-7 (Gates 1.x + Go checks)"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --- JOB 0: FILTRO DE CAMINHOS ---
  # Define quais jobs devem ser executados com base nos arquivos alterados.
  path-filter:
    name: Check for relevant file changes
    runs-on: ubuntu-latest
    outputs:
      should_run_go_checks: ${{ steps.filter.outputs.go_code_changes == 'true' }}
      should_run_gate_checks: ${{ steps.filter.outputs.gate_related_changes == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go_code_changes:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/governanca-waves4-7.yml'
            gate_related_changes:
              - 'internal/**/*.go'
              - 'pkg/**/*.go'
              - 'cmd/**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/**'
              - 'docs/qa/gates/**'
              - 'docs/architecture/**'

  # --- JOB 1: VERIFICAÇÕES DE CÓDIGO GO ---
  go-checks:
    name: "Go Checks (Test, Vet, Lint)"
    needs: [path-filter]
    if: |
      needs.path-filter.outputs.should_run_go_checks == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go Test
        run: go test ./...
      - name: Go Vet
        run: go vet ./...
      - name: Run golangci-lint (non-blocking)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.0 # Mantendo a versão do arquivo original
          # --issues-exit-code=0 mantém os avisos como feedback, mas não falha o job.
          args: --config=.golangci.yml --issues-exit-code=0 ./...

  # --- JOB 2: VERIFICAÇÕES DOS GATES DE GOVERNANÇA ---
  gate-checks:
    name: "Governance Gate Checks"
    needs: [path-filter]
    if: |
      needs.path-filter.outputs.should_run_gate_checks == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gate 1.x.no-osexit-core
        run: |
          echo "Verificando uso de os.Exit fora de cmd/shantilly/main.go (apenas código Go)..."
          violations=$(grep -RIn "os.Exit" internal pkg cmd \
            --include="*.go" \
            --exclude-dir=".git" \
            --exclude="cmd/shantilly/main.go" || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Encontrado os.Exit fora de cmd/shantilly/main.go em código Go:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.legacy-formcomponent-encapsulation
        run: |
          echo "Verificando encapsulamento do legado (FormConfig/internal/tui)..."
          violations=$(grep -RInE "FormConfig|internal/tui" \
            --exclude-dir=.git \
            --exclude="internal/components/form_component.go" \
            --exclude-dir="internal/tui" || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Uso de FormConfig/internal/tui fora do sandbox permitido:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.scriptrunner-and-update-target
        run: |
          echo "Verificando execução de scripts apenas em internal/runtime/runner/**..."
          violations=$(grep -RInE "exec.Command|os/exec" \
            --exclude-dir=.git \
            --exclude-dir="internal/runtime/runner" || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Execução de scripts encontrada fora de internal/runtime/runner/**:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.layout-manager
        run: |
          echo "Verificando se internal/runtime/layout/** não contém automação proibida..."
          violations=$(grep -RInE "RunAction|run\.script|update_target|FormConfig|internal/tui" internal/runtime/layout || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Padrões proibidos encontrados em internal/runtime/layout/**:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.event-engine
        run: |
          echo "Verificando rotas paralelas suspeitas no Event Engine..."
          violations=$(grep -RInE "exec.Command|os/exec|os.Exit" internal/runtime/event || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Padrões não permitidos encontrados em internal/runtime/event/**:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.modal-stack
        run: |
          echo "Verificando definições de Modal Stack apenas em internal/runtime/modal/**..."
          violations=$(grep -RInE "type ModalStack|pushModal|popModal" \
            --exclude-dir=.git \
            --exclude-dir="internal/runtime/modal" || true)
          if [ -n "$violations" ]; then
            echo "FALHA: Indícios de modal stack fora de internal/runtime/modal/**:"
            echo "$violations"
            exit 1
          fi

      - name: Gate 1.x.security-jit-anti-trojan
        run: |
          echo "Verificando presença de contratos de segurança JIT / Anti-Trojan..."
          required_files=("docs/qa/gates/1.x.security-jit-anti-trojan.yml" "docs/architecture/security.md")
          missing=""
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              missing="$missing\n- $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "FALHA: Artefatos normativos esperados não encontrados:$missing"
            exit 1
          fi

      - name: Gate 1.x + Matriz — consistência mínima documental
        run: |
          echo "Verificando existência da matriz QA e gates principais..."
          if [ ! -f "docs/qa/matrix-epic-1-runtime-tui-coverage.md" ]; then
            echo "FALHA: Matriz de QA não encontrada em docs/qa/matrix-epic-1-runtime-tui-coverage.md"
            exit 1
          fi
          # Adicionei uma verificação de loop mais robusta
          for gate in docs/qa/gates/1.x.*.yml; do
            if [ ! -f "$gate" ]; then
                echo "AVISO: Nenhum arquivo de gate encontrado em docs/qa/gates/. Pulando verificação."
                break
            fi
          done
